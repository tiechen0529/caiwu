name: Build and publish Docker image
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify accounting and self-hosted API
        run: npm test
      - name: Verify frontend build
        run: npm run build
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build native image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: qingzhang:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the runtime image and database volume
        shell: bash
        run: |
          docker volume create qingzhang-smoke
          docker run -d --name qingzhang-smoke -p 127.0.0.1:8080:3000 -v qingzhang-smoke:/data qingzhang:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/healthz
          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/ledger)
          test "$status" = 401
          docker exec qingzhang-smoke test -s /data/admin-password
          docker restart qingzhang-smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/healthz
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified amd64 / arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/tiechen0529/caiwu:latest
            ghcr.io/tiechen0529/caiwu:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/tiechen0529/caiwu
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Cleanup smoke-test resources
        if: always()
        run: |
          docker rm -f qingzhang-smoke 2>/dev/null || true
          docker volume rm qingzhang-smoke 2>/dev/null || true
